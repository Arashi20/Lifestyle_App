{% extends "base.html" %}
{% block title %}{{ "Edit" if product else "Add" }} Product{% endblock %}

{% block content %}
<h1>{{ "Edit" if product else "Add" }} Product</h1>

<form method="POST" class="form">
    <label>Name
        <input type="text" name="name" value="{{ product.name if product else '' }}" required>
    </label>

    <label>Brand
        <input type="text" name="brand" value="{{ product.brand if product else '' }}">
    </label>

    <label>Category
        <input type="text" name="category" value="{{ product.category if product else '' }}" placeholder="cleanser, moisturizer, serum...">
    </label>

    <label>Status
        <select name="status">
            {% for value, label in [("wishlist", "Wishlist"), ("currently_using", "Currently using"), ("finished", "Finished"), ("abandoned", "Abandoned")] %}
            <option value="{{ value }}" {{ "selected" if product and product.status == value }}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Rating (1-5)
        <input type="number" name="rating" min="1" max="5" value="{{ product.rating if product else '' }}">
    </label>

    <label>Notes (what worked / didn't)
        <textarea name="skin_notes" rows="4">{{ product.skin_notes if product else '' }}</textarea>
    </label>

    <label>Ingredients
        {% if ocr_ingredients %}<span class="card-subtitle">Extracted from your photo — double-check it, OCR isn't perfect</span>{% endif %}
        <textarea name="ingredients" rows="4" placeholder="paste or type the ingredient list">{{ ocr_ingredients or (product.ingredients if product else '') }}</textarea>
    </label>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
