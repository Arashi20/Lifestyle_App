{% extends "base.html" %}
{% block title %}{{ "Edit" if haircut else "Add" }} Haircut{% endblock %}

{% block content %}
<h1>{{ "Edit" if haircut else "Add" }} Haircut</h1>

<form method="POST" class="form">
    <label>Salon / Barber
        <input type="text" name="salon_or_barber" value="{{ haircut.salon_or_barber if haircut else '' }}">
    </label>

    <label>Date
        <input type="date" name="date" value="{{ haircut.date if haircut else '' }}" required>
    </label>

    <label>Description
        <textarea name="description" rows="3">{{ haircut.description if haircut else '' }}</textarea>
    </label>

    <label>How to request this again
        <textarea name="how_to_request" rows="3">{{ haircut.how_to_request if haircut else '' }}</textarea>
    </label>

    <label>Rating (1-5)
        <input type="number" name="rating" min="1" max="5" value="{{ haircut.rating if haircut else '' }}">
    </label>

    <label>Photo link (e.g. Amazon Photos)
        <input type="url" name="photo_url" value="{{ haircut.photo_url if haircut else '' }}" placeholder="https://www.amazon.de/photos/album/...">
    </label>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('haircuts.list_haircuts') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
